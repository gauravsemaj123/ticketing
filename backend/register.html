<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kamatis</title>
    <link rel="stylesheet" href="../cs/background.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="body"></div>
    <div class="text-light d-flex justify-content-center align-items-center">
        <div style="width: 40%; padding:1em; border-radius: 30px; border: black; border-width: 2px; background-color: rgba(0, 0, 0, 0.388); position: absolute; top: 4em;">
            <h1 class="text-center" style="font-weight: bold;">Register</h2>
            <form action="">
                <div class="text-center" style="margin-top: 1em;">
                    EMAIL<br>
                    <input class="text-light, bg-dark" name="" id="" style="width: 80%; color: white;">
                </div>
                <div class="text-center" style="margin-top: 1em;">
                    USERNAME<br>
                    <input class="text-light, bg-dark" name="" id="" style="width: 80%; color: white;">
                </div>
                <div class="text-center" style="margin-top: 1em;">
                    PASSWORD<br>
                    <input class="text-light bg-dark" type="password" name="" id="" style="color: white; width: 80%;">
                </div>
                <div class="text-center" style="margin-top: 1em;">
                    CONFIRM PASSWORD<br>
                    <input class="text-light bg-dark" style="width: 80%; color: white;" type="password" name="" id="">
                </div>
                <div class="d-flex justify-content-center align-items-center" style="margin-left:2.5em; margin-top: 1em; width: fit-content;">
                    <input class="m-2" type="checkbox" name="" id="" value="">
                    <p class="m-2" style="font-size: xx-small;">I agree to the <a class="text-light" href="">Terms of Service</a> and <a class="text-light" href="">Privacy Policy</a></p>
                </div>
                <div class="text-center">
                    <button style="margin: 1em; color: white; width: 60%; background: linear-gradient(to right, rgb(228, 169, 29), rgb(163, 121, 22)); " class="btn" type="submit">REGISTER</button>
                </div>
                <div class="text-center">
                    <p class="m-2" style="font-size: small;">Already have an account? <a class="text-light" href="../index.html">Log in here.</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
